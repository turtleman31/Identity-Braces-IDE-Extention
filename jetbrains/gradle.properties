pluginVersion = 1.2.3

# The lowest platform the plugin supports, and therefore the one it compiles against: an API
# that is missing here fails the build rather than failing at runtime for someone on 2024.1.
# One plugin serves every JetBrains IDE — IntelliJ IDEA, Rider, CLion, WebStorm, PyCharm,
# GoLand — because it depends on nothing but the platform editor.
platformType = IC
platformVersion = 2024.1.7
pluginSinceBuild = 241

# The Rider build `./gradlew runRider` opens the plugin in.
riderVersion = 2024.1.7

# The IDE ships its own Kotlin standard library; bundling a second copy is the classic
# plugin-verifier complaint.
kotlin.stdlib.default.dependency = false
kotlin.code.style = official

org.gradle.jvmargs = -Xmx2g
org.gradle.caching = true
