# Builds all three extensions and runs every test suite on every push and pull request.
# Every run uploads the two VSIX files and the JetBrains plugin zip as artifacts (Actions tab
# -> the run -> Artifacts), so nobody needs a Visual Studio build setup just to try it.
#
# Pushing any tag (git tag v1.2.2 && git push origin v1.2.2 — with or without the "v")
# additionally creates a GitHub Release with all three attached, named
# IdentityBraces-<version>-VisualStudio.vsix, -VSCode.vsix and -JetBrains.zip.

name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  visual-studio:
    name: Visual Studio extension
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The VSIX build needs MSBuild plus the Microsoft.VSSDK.BuildTools NuGet package, which
      # restore brings in. No "Visual Studio extension development" workload is required.
      - uses: microsoft/setup-msbuild@v2

      # The core tests target net8.0-windows.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: msbuild IdentityBraces.sln -t:Restore -p:Configuration=Release

      # DeployExtension=false stops the VSSDK targets from trying to install the build into
      # an experimental Visual Studio instance, which only makes sense on a developer machine.
      - name: Build VSIX
        run: msbuild IdentityBraces.sln -p:Configuration=Release -p:DeployExtension=false

      - name: Core tests
        run: dotnet run -c Release
        working-directory: tests/IdentityBraces.CoreTests

      - uses: actions/upload-artifact@v4
        with:
          name: IdentityBraces-VisualStudio
          path: src/IdentityBraces/bin/Release/IdentityBraces.vsix
          if-no-files-found: error

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4

      # `node --test` with a glob pattern needs Node 21+.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Package VSIX
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: IdentityBraces-VSCode
          path: vscode/*.vsix
          if-no-files-found: error

  jetbrains:
    name: JetBrains plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetbrains
    steps:
      - uses: actions/checkout@v4

      # Gradle itself needs 17+; the plugin compiles for 17 so that 2024.1 can still load it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The core tests, the C# parity fixture, and the headless editor tests.
      - name: Tests
        run: ./gradlew test --no-daemon

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: IdentityBraces-JetBrains
          path: jetbrains/build/distributions/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [visual-studio, vscode, jetbrains]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Each build names its output after itself, which side by side in a release says nothing
      # about which IDE a file is for. Rename them here, so local builds keep their usual
      # names. The version is the tag, with or without a leading "v".
      - name: Name each file after the IDE it is for
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          mv dist/IdentityBraces.vsix    "dist/IdentityBraces-$version-VisualStudio.vsix"
          mv dist/identity-braces-*.vsix "dist/IdentityBraces-$version-VSCode.vsix"
          mv dist/identity-braces-*.zip  "dist/IdentityBraces-$version-JetBrains.zip"
          ls -l dist

      # Creates the release. If one already exists for this tag — a re-run, or a tag that was
      # moved — its assets are replaced with this build's instead of failing, so a release
      # always reflects the last successful run for its tag.
      - name: Create or update the release with the VSIX files and the plugin zip attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            for asset in $(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$TAG" "$asset" --repo "$REPO" --yes
            done
            gh release upload "$TAG" dist/*.vsix dist/*.zip --repo "$REPO"
          else
            gh release create "$TAG" dist/*.vsix dist/*.zip --repo "$REPO" --title "$TAG" --generate-notes
          fi
